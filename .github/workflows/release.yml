name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0). Tag v<version> will be created."
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-13
            name: darwin-x64
          - os: macos-14
            name: darwin-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Build binary
        shell: bash
        working-directory: packages/dewcode
        env:
          DEWCODE_RELEASE: "1"
        run: |
          VER="${{ github.event_name == 'push' && github.ref_name || inputs.version }}"
          VER="${VER#v}"
          if [ -z "$VER" ]; then
            echo "::error::Release version is required (tag v* or workflow_dispatch input)"
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
          DEWCODE_VERSION="$VER" bun run build --single --skip-install --skip-embed-web-ui
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: packages/dewcode/dist/dewcode-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        shell: bash
        run: |
          VER="${{ github.event_name == 'push' && github.ref_name || inputs.version }}"
          VER="${VER#v}"
          if [ -z "$VER" ]; then
            echo "::error::Release version is required (tag v* or workflow_dispatch input)"
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes
