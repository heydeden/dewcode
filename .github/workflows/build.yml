name: Build DEWCode Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build binary
        shell: bash
        working-directory: packages/dewcode
        run: bun run script/build.ts --single

      - name: Package binary
        shell: bash
        working-directory: packages/dewcode/dist/dewcode-${{ matrix.platform }}/bin
        run: |
          ls -la
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            7z a ../../dewcode-${{ matrix.platform }}.zip .
          else
            tar -czf ../../dewcode-${{ matrix.platform }}.tar.gz .
          fi

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dewcode-${{ matrix.platform }}
          path: packages/dewcode/dist/dewcode-${{ matrix.platform }}.tar.gz

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dewcode-${{ matrix.platform }}
          path: packages/dewcode/dist/dewcode-${{ matrix.platform }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: dewcode-*

      - name: Get version
        id: version
        run: |
          VERSION=$(cat packages/dewcode/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts/ -name "*.tar.gz" -o -name "*.zip" | while read f; do
            cp "$f" release/
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DEWCode v${{ steps.version.outputs.version }}
          body: |
            ## DEWCode v${{ steps.version.outputs.version }}

            AI-powered development tool by Deden Wirjadinata.

            ### Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/heydeden/dewcode/main/install | bash
            ```

            ### Manual Download
            Download the binary for your platform and add to PATH.
          files: release/*
          draft: false
          prerelease: false
